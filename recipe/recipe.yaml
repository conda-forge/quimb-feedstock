schema_version: 1

context:
  name: quimb
  version: 1.16.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/quimb-${{ version }}.tar.gz
  sha256: b5ba4b7172fb516d053ed52150f8b04196fb13f1f226e9e691f61cf2de4b67f1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.17
    - scipy >=1.16.0
    - numba >=0.39
    - psutil >=4.3.1
    - cytoolz >=0.8.0
    - tqdm >=4
    - autoray >=0.10.0
    - cotengra >=0.8.3
tests:
  - python:
      imports:
        - quimb
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Quantum information and many-body library.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: http://quimb.readthedocs.io

extra:
  recipe-maintainers:
    - jcmgray
    - jan-janssen
